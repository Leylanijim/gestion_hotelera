
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión Hotelera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #12283f, #245678);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 10px;
            color: #173b56;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #687785;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #263b4c;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5dd;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #4a91b9;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #176b96;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125678;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #mensaje {
            margin-top: 18px;
            color: #b42318;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Gestión Hotelera</h1>
        <p class="subtitle">Acceso del personal</p>

        <form id="loginForm">
            <label for="usuario">Usuario o correo</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="btnLogin">
                Iniciar sesión
            </button>

            <p id="mensaje" role="alert"></p>
        </form>
    </main>

    <script>
        const formulario = document.getElementById("loginForm");
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("btnLogin");

        function redirigir(rol) {
            if (rol === "Administrador") {
                window.location.replace("./index.html");
            } else if (rol === "Recepcionista") {
                window.location.replace("./Recepcionista/index.html");
            } else {
                mensaje.textContent = "Rol de usuario no reconocido.";
            }
        }

        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();

            mensaje.textContent = "";
            boton.disabled = true;
            boton.textContent = "Ingresando...";

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value;

            try {
                const respuesta = await fetch("./api/login.php", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuario,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.success) {
                    mensaje.textContent =
                        datos.message || "No se pudo iniciar sesión.";
                    return;
                }

                redirigir(datos.data.rol);

            } catch (error) {
                console.error("Error de inicio de sesión:", error);
                mensaje.textContent =
                    "No se pudo conectar con el servidor.";
            } finally {
                boton.disabled = false;
                boton.textContent = "Iniciar sesión";
            }
        });
    </script>
</body>
</html>
